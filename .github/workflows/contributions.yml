name: Update contributions
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/contributions.mjs
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: |
          git config user.name "rex-bit"
          git config user.email "202890628+rex-bit@users.noreply.github.com"
          git add contributions.json
          git diff --cached --quiet || (git commit -m "Update contributions" && git push)
