<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | rex-bit</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#050505;--ink:#EDEDF0;--muted:#8E8E99;--line:#232328;--accent:#FF7A3D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  display:grid;place-items:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:520px;min-width:0}
.code{font:500 13px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}
h1{font:800 clamp(64px,22vw,140px)/.9 "Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;letter-spacing:-.045em;margin:0 0 20px}
h1 i{font-style:normal;color:var(--accent)}
p{margin:0 0 24px;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;background:var(--accent);color:#050505;font:600 15px/1 "IBM Plex Sans",sans-serif;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Lost<i>.</i></h1>
  <p>That page doesn't exist, or it was moved. The portfolio is one tap away.</p>
  <a class="btn" href="/Rex-bit/">Back to portfolio</a>
</main>
</body>
</html>
