<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | rex-bit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#050505;--surface:#0E0E11;--ink:#EDEDF0;--muted:#9A9AA6;--line:#2A2A31;--accent:#FF7A3D;--accent-ink:#050505;
  --sign:#4a4a56;--bubble:#EDEDF0;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.6 var(--body);display:grid;place-items:center;position:relative;overflow-x:hidden;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:-48px;z-index:-2;background:url(/Rex-bit/assets/bg.jpg) center/cover no-repeat;filter:blur(14px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(5,5,5,.6),rgba(5,5,5,.92) 78%)}
main{text-align:center;max-width:640px;width:100%;min-width:0}
.art{display:block;width:min(600px,100%);height:auto;margin:0 auto 6px;overflow:visible}
.art .top{fill:#3b3d4c} .art .side{fill:#23242e} .art .side2{fill:#1a1b23}
.art .stud{fill:#4a4c5e} .art .stud2{fill:#fff;opacity:.22}
.art .deco{fill:none;stroke:#5b5e72;stroke-width:2;stroke-linecap:round} .art .deco circle{fill:#5b5e72;stroke:none}
.art .ghost rect{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5;opacity:.5}
.art .bits rect{fill:var(--accent);opacity:.8}
.art .float{animation:fl 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.art .hero{animation:hb 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.art .bubble{animation:bb 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}
.art .b1{animation:fall 2.6s linear infinite} .art .b2{animation:fall 2.6s linear .9s infinite} .art .b3{animation:fall 2.6s linear 1.6s infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes hb{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.985)}}
@keyframes bb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fall{0%{transform:translateY(-8px);opacity:0}15%{opacity:.85}100%{transform:translateY(54px);opacity:0}}
@media (prefers-reduced-motion:reduce){.art *{animation:none!important}}
h1{font:800 clamp(30px,7vw,44px)/1.1 var(--display);letter-spacing:-.025em;margin:6px 0 10px;text-wrap:balance}
p{margin:0 auto 16px;max-width:42ch;color:var(--muted)}
code{display:inline-block;max-width:100%;overflow-wrap:anywhere;font:400 13px/1.4 var(--mono);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(14,14,17,.7);color:var(--ink);margin:0 0 24px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;font:600 15px/1 var(--body);text-decoration:none;border:1px solid var(--line);background:rgba(14,14,17,.75);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>

  <!-- question bubble -->
  <g class="bubble">

    <text x="260" y="152" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="30" letter-spacing="1" fill="var(--bg)">404</text>
  </g>

  <!-- falling bits -->

  <h1 id="line">Page not found!</h1>
